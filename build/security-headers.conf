# Included in every location, since add_header in a location replaces inherited headers.
# connect-src is open: the spec, API and auth server are configured at runtime.
# data: is needed for WebAwesome icons, which are fetched.
# frame-src / frame-ancestors: silent token renew runs the auth server and silent-renew.html in a
# hidden iframe. The auth server comes from the spec at runtime, so any https origin may be framed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://ka-f.fontawesome.com; font-src 'self' data:; connect-src * data:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
